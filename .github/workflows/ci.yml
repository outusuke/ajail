name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y bubblewrap squashfs-tools xdg-dbus-proxy python3-pyflakes
      - name: ajail is up to date with src/ and the layer rule holds
        run: python3 tests/test_build.py
      - name: Lint
        run: python3 -m pyflakes ajail ajail-gui build.py make-selftest tests/test_*.py
      - name: Unit tests (no sandbox needed)
        run: |
          for t in $(ls tests/test_*.py | grep -v hostile); do python3 "$t"; done
      - name: Hostile AppImages
        # Needs unprivileged user namespaces; GitHub's Ubuntu images restrict them, so allow them for this job.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          python3 tests/test_hostile.py
